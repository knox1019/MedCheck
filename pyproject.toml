[project]
name = "medcheck"
version = "0.1.0"
description = "医疗 RAG + Agent：体检报告解读与用药禁忌核查"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.156.8",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
