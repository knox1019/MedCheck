<svg viewBox="0 0 680 520" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MedCheck 分层架构</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="th" x="40" y="28" font-size="14" fill="#1a1d23">MedCheck 数据流：从 PDF 到带出处的核对结论</text>

  <g class="c-gray">
    <rect x="40" y="44" width="420" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text class="th" x="56" y="66" font-size="13" fill="#444441">展示层</text>
    <text class="ts" x="56" y="84" font-size="12" fill="#5F5E5A">web/index.html · 上传 → 指标表 → 核对结果 + 工具轨迹</text>
  </g>
  <line class="arr" x1="250" y1="98" x2="250" y2="112" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="c-blue">
    <rect x="40" y="114" width="420" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="56" y="136" font-size="13" fill="#0C447C">接口层</text>
    <text class="ts" x="56" y="154" font-size="12" fill="#378ADD">/api/report/parse · /api/chat（无状态，503 语义分离）</text>
  </g>
  <line class="arr" x1="250" y1="168" x2="250" y2="182" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="c-teal">
    <rect x="40" y="184" width="420" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="56" y="206" font-size="13" fill="#085041">编排层</text>
    <text class="ts" x="56" y="224" font-size="12" fill="#1D9E75">qa.answer() 固定流程（单事实问题，快）</text>
    <text class="ts" x="56" y="242" font-size="12" fill="#1D9E75">agent.run() 自主编排 · search / check / list 三工具</text>
  </g>
  <line class="arr" x1="250" y1="256" x2="250" y2="270" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="c-green">
    <rect x="40" y="272" width="420" height="72" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="56" y="294" font-size="13" fill="#27500A">能力层</text>
    <text class="ts" x="56" y="312" font-size="12" fill="#639922">retriever 门控 → 过滤 → 阈值 → 重排 → 溯源</text>
    <text class="ts" x="56" y="330" font-size="12" fill="#639922">analyzer 异常指标 × 在服药物（关键词精确召回）</text>
  </g>
  <line class="arr" x1="250" y1="344" x2="250" y2="358" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="c-amber">
    <rect x="40" y="360" width="420" height="54" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="56" y="382" font-size="13" fill="#633806">数据层</text>
    <text class="ts" x="56" y="400" font-size="12" fill="#BA7517">Chroma 657 药 / 1659 条 · pdf_parser 21 指标全对</text>
  </g>
  <line class="arr" x1="250" y1="414" x2="250" y2="428" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g class="c-gray">
    <rect x="40" y="430" width="420" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="56" y="452" font-size="13" fill="#444441">本地依赖</text>
    <text class="ts" x="56" y="470" font-size="12" fill="#5F5E5A">Ollama bge-m3（1024 维） · 模型网关（思考模式）</text>
  </g>

  <line class="leader" x1="460" y1="220" x2="492" y2="150" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <g class="c-teal">
    <rect x="492" y="120" width="150" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="502" y="141" font-size="12" fill="#085041">引用编号全局唯一</text>
    <text class="ts" x="502" y="158" font-size="11" fill="#1D9E75">同 chunk 只发一号</text>
    <text class="ts" x="502" y="172" font-size="11" fill="#1D9E75">产生时唯一，不后补</text>
  </g>

  <line class="leader" x1="460" y1="308" x2="492" y2="240" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <g class="c-green">
    <rect x="492" y="210" width="150" height="74" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
    <text class="th" x="502" y="231" font-size="12" fill="#27500A">三层拒答防线</text>
    <text class="ts" x="502" y="248" font-size="11" fill="#639922">1 实体门控（药不在库）</text>
    <text class="ts" x="502" y="262" font-size="11" fill="#639922">2 相关度阈值（跑题）</text>
    <text class="ts" x="502" y="276" font-size="11" fill="#639922">3 资料覆盖（模型判断）</text>
  </g>

  <line class="leader" x1="460" y1="308" x2="492" y2="330" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <g class="c-coral">
    <rect x="492" y="300" width="150" height="74" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text class="th" x="502" y="321" font-size="12" fill="#712B13">宁 unknown 不猜测</text>
    <text class="ts" x="502" y="338" font-size="11" fill="#D85A30">参考范围解析失败 → unknown</text>
    <text class="ts" x="502" y="352" font-size="11" fill="#D85A30">语料没写 → 如实拒答</text>
    <text class="ts" x="502" y="366" font-size="11" fill="#D85A30">因果不明 → 交医生判断</text>
  </g>

  <line class="leader" x1="460" y1="308" x2="492" y2="420" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <g class="c-blue">
    <rect x="492" y="390" width="150" height="74" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="502" y="411" font-size="12" fill="#0C447C">评测先行</text>
    <text class="ts" x="502" y="428" font-size="11" fill="#378ADD">检索 69 · 答案 21 · Agent 18</text>
    <text class="ts" x="502" y="442" font-size="11" fill="#378ADD">15 项确定性指标</text>
    <text class="ts" x="502" y="456" font-size="11" fill="#378ADD">3 个负结果也入档</text>
  </g>

  <text class="ts" x="40" y="506" font-size="12" fill="#8b95a5">实测：单条问答 7–26s · Agent 平均 1.1 次工具调用 · 三套评测全绿</text>
</svg>
